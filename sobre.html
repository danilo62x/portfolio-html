<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Sobre — Estúdio Norte</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/pf.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    const VALUES = [
      { icon: 'search', titleKey: 'about.values.v1.title', descKey: 'about.values.v1.desc' },
      { icon: 'users', titleKey: 'about.values.v2.title', descKey: 'about.values.v2.desc' },
      { icon: 'chart', titleKey: 'about.values.v3.title', descKey: 'about.values.v3.desc' },
      { icon: 'shield-check', titleKey: 'about.values.v4.title', descKey: 'about.values.v4.desc' },
    ];

    const TIMELINE = [
      { year: '2012', key: 'about.timeline.t1' },
      { year: '2016', key: 'about.timeline.t2' },
      { year: '2020', key: 'about.timeline.t3' },
      { year: '2023', key: 'about.timeline.t4' },
      { year: '2026', key: 'about.timeline.t5' },
    ];

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon;
      const team = PF.get().team;

      const header =
        '<header class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:py-16 lg:px-8">' +
        '<div class="grid gap-10 lg:grid-cols-2 lg:items-center"><div>' +
        '<p class="text-sm font-semibold uppercase tracking-wider text-brand-500">' + t('about.eyebrow') + '</p>' +
        '<h1 class="mt-2 font-bold text-heading text-title-sm sm:text-title-md">' + t('about.title') + '</h1>' +
        '<p class="mt-4 text-muted">' + t('about.p1') + '</p>' +
        '<p class="mt-3 text-muted">' + t('about.p2') + '</p></div>' +
        '<img src="' + Data.pfImage('studio-hero', 960, 720) + '" alt="" class="aspect-4/3 w-full rounded-2xl object-cover shadow-theme-lg"/>' +
        '</div></header>';

      const values =
        '<section class="border-y border-themed surface-card"><div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">' +
        '<h2 class="font-bold text-heading text-title-sm">' + t('about.valuesTitle') + '</h2>' +
        '<div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">' +
        VALUES.map((v) =>
          '<div class="rounded-2xl border border-themed p-6">' +
          '<span class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand-50 text-brand-500 dark:bg-brand-500/15">' + icon(v.icon, { size: 20 }) + '</span>' +
          '<h3 class="mt-4 text-base font-bold text-heading">' + t(v.titleKey) + '</h3>' +
          '<p class="mt-2 text-sm text-muted">' + t(v.descKey) + '</p></div>'
        ).join('') + '</div></div></section>';

      const teamSection =
        '<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">' +
        '<h2 class="font-bold text-heading text-title-sm">' + t('about.teamTitle') + '</h2>' +
        '<p class="mt-3 max-w-2xl text-muted">' + t('about.teamSubtitle') + '</p>' +
        '<div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">' + team.map((m) => UI.teamCard(m)).join('') + '</div></section>';

      const timeline =
        '<section class="border-y border-themed bg-gray-50 dark:bg-gray-900/40"><div class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">' +
        '<h2 class="font-bold text-heading text-title-sm">' + t('about.timelineTitle') + '</h2>' +
        '<ol class="mt-8 space-y-6 border-l border-themed pl-6">' +
        TIMELINE.map((item) =>
          '<li class="relative"><span class="absolute -left-[31px] top-1.5 h-3 w-3 rounded-full border-2 border-brand-500 bg-[color:var(--tx-body-bg)]"></span>' +
          '<p class="text-sm font-semibold text-brand-500">' + item.year + '</p>' +
          '<p class="mt-1 text-sm text-muted">' + t(item.key) + '</p></li>'
        ).join('') + '</ol></div></section>';

      const clients =
        '<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">' +
        '<p class="text-center text-sm text-muted">' + t('home.clients.title') + '</p>' +
        '<div class="mt-8">' + UI.clientLogos() + '</div>' +
        '<div class="mt-12 text-center"><a href="contato.html" class="inline-flex h-12 items-center gap-2 rounded-xl bg-brand-500 px-6 text-sm font-medium text-white transition hover:bg-brand-600">' +
        t('about.cta') + icon('arrow-right', { size: 18 }) + '</a></div></section>';

      document.getElementById('page').innerHTML = header + values + teamSection + timeline + clients;
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
